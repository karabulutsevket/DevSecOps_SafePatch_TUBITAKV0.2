# Unit and contract tests on every push and pull request.
# Java/Maven/Ollama integration tests need the prepared offline runtime and run locally.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Actions are pinned to full commit hashes (supply-chain hygiene); tags in comments.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.lock
      - name: Create owned synthetic repositories
        run: python scripts/seed.py > /dev/null
      - name: Unit and contract tests
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/evidence
        run: python -m pytest -q -p no:cacheprovider -m "not integration" --junitxml="$RUNNER_TEMP/evidence/unit-tests.xml"
      - name: V0.1 evidence archive is unchanged
        run: git diff --exit-code -- evidence

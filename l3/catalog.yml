  - {id: vul4j-43, source: vul4j, project: eclipse-rdf4j/rdf4j, cwe: CWE-22, split: evaluation, license: BSD-3-Clause, upstream: {repo: "https://github.com/eclipse-rdf4j/rdf4j", cve: CVE-2018-20227}, status: planned}
  - {id: vul4j-18, source: vul4j, project: apache/jspwiki, cwe: CWE-22, split: evaluation, license: Apache-2.0, upstream: {repo: "https://github.com/apache/jspwiki", cve: CVE-2019-0225}, status: planned}
